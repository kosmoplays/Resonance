name: Build iOS App (Sideloadly)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim

      - name: Install frontend dependencies
        run: npm install

      - name: Initialize iOS project
        run: npx tauri ios init

      - name: Build Tauri iOS App (Unsigned)
        run: |
          # First run tauri ios build to prepare the rust side and project (it will fail at codesign, which is fine)
          npx tauri ios build || true
          
          echo "Buscando proyecto Xcode..."
          cd src-tauri/gen/apple
          
          # Force build with Xcode directly
          xcodebuild -project *.xcodeproj -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_IDENTITY="" || true

      - name: Generate .ipa Payload
        run: |
          # Buscar la carpeta generada por Xcode
          APP_PATH=$(find src-tauri/gen/apple ~/Library/Developer/Xcode/DerivedData -type d -name "*.app" 2>/dev/null | grep -i "iphoneos" | head -n 1)
          
          if [ -d "$APP_PATH" ]; then
            echo "Aplicación encontrada en: $APP_PATH"
            mkdir -p Payload
            # Importante: macOS usa symlinks internos en los archivos .app, cp y zip deben conservarlos (-a y -y)
            cp -a "$APP_PATH" Payload/
            zip -qry Resonance.ipa Payload
            echo "IPA_PATH=$PWD/Resonance.ipa" >> $GITHUB_ENV
          else
            echo "Directorio de build no encontrado."
            exit 1
          fi

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resonance-iOS-IPA
          path: ${{ env.IPA_PATH }}
          retention-days: 3



