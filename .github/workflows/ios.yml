name: Build iOS App (Sideloadly)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim

      - name: Install frontend dependencies
        run: npm install

      - name: Initialize iOS project
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          npx tauri ios init
          
      - name: Patch iOS Native Code (Background Audio & Safe Area)
        run: |
          python scripts/patch_ios.py
          cd src-tauri/gen/apple
          xcodegen

      - name: Crear Interceptor xcodebuild para firmar nulo
        run: |
          mkdir -p .github/bin
          echo '#!/bin/bash' > .github/bin/xcodebuild
          echo 'exec /usr/bin/xcodebuild "$@" OTHER_LDFLAGS="${inherited} -framework AVFoundation" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_IDENTITY=""' >> .github/bin/xcodebuild
          chmod +x .github/bin/xcodebuild
          echo "$(pwd)/.github/bin" >> $GITHUB_PATH

      - name: Build Tauri iOS App (Unsigned)
        run: |
          npx tauri ios build || echo "Tauri build failed (likely at exportArchive), but we only need the .app!"

      - name: Generate .ipa Payload
        run: |
          # Search for the .app generated by Xcode
          APP_PATH=$(find . ~/Library/Developer/Xcode/DerivedData -type d -name "*.app" 2>/dev/null | grep -i "iphoneos" | head -n 1)
          
          if [ -d "$APP_PATH" ]; then
            echo "Aplicación encontrada en: $APP_PATH"
            mkdir -p Payload
            # Importante: macOS usa symlinks internos en los archivos .app, cp y zip deben conservarlos (-a y -y)
            cp -a "$APP_PATH" Payload/
            zip -qry Resonance.ipa Payload
            echo "IPA_PATH=$PWD/Resonance.ipa" >> $GITHUB_ENV
          else
            echo "Directorio de build no encontrado."
            exit 1
          fi

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resonance-iOS-IPA
          path: ${{ env.IPA_PATH }}
          retention-days: 3



















