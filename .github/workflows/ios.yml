name: Compilar iOS
on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Instalar dependencias
        run: npm install

      - name: Compilar App (Tauri Build)
        run: |
          npx tauri ios build -- CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          find src-tauri/gen/apple -type d -name "Resonance.app" -exec cp -R {} Payload/ \;
          zip -r Resonance.ipa Payload

      - name: Guardar archivo .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Resonance-App
          path: Resonance.ipa
