name: Build iOS App (Sideloadly)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim

      - name: Install frontend dependencies
        run: npm install

      - name: Initialize iOS project
        run: npx tauri ios init

      - name: Build Tauri iOS App (Unsigned)
        run: |
          # Exportamos variables para saltar la firma de Apple
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGNING_IDENTITY=""
          
          # Compilamos la aplicación
          npx tauri ios build

      - name: Generate .ipa Payload
        run: |
          # Buscar la carpeta generada por Xcode
          BUILD_DIR=$(find src-tauri/gen/apple/build -type d -name "Release-iphoneos" | head -n 1)
          if [ -d "$BUILD_DIR" ]; then
            cd "$BUILD_DIR"
            mkdir -p Payload
            cp -R *.app Payload/
            zip -qr Resonance.ipa Payload
            echo "IPA_PATH=$PWD/Resonance.ipa" >> $GITHUB_ENV
          else
            echo "Directorio de build no encontrado."
            exit 1
          fi

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resonance-iOS-IPA
          path: ${{ env.IPA_PATH }}
          retention-days: 3
