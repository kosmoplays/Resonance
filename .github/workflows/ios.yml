name: Build iOS App (Sideloadly)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim

      - name: Install frontend dependencies
        run: npm install

      - name: Initialize iOS project
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          npx tauri ios init
          
          echo "Installing xcodeproj to disable code signing..."
          gem install xcodeproj
          ruby -e "
          require 'xcodeproj'
          project_path = Dir.glob('src-tauri/gen/apple/*.xcodeproj').first
          project = Xcodeproj::Project.open(project_path)
          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
              config.build_settings['CODE_SIGN_IDENTITY'] = ''
              config.build_settings['CODE_SIGN_ENTITLEMENTS'] = ''
              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              config.build_settings.delete('DEVELOPMENT_TEAM')
            end
          end
          project.save
          "

      - name: Build Tauri iOS App (Unsigned)
        run: |
          echo "CODE_SIGNING_ALLOWED = NO" > unsigned.xcconfig
          echo "CODE_SIGNING_REQUIRED = NO" >> unsigned.xcconfig
          echo "CODE_SIGN_IDENTITY = " >> unsigned.xcconfig
          echo "CODE_SIGN_ENTITLEMENTS = " >> unsigned.xcconfig
          echo "CODE_SIGN_STYLE = Manual" >> unsigned.xcconfig
          echo "DEVELOPMENT_TEAM = " >> unsigned.xcconfig
          echo "PROVISIONING_PROFILE_SPECIFIER = " >> unsigned.xcconfig
          
          npx tauri ios build -- -xcconfig "$(pwd)/unsigned.xcconfig" SYMROOT="$(pwd)/build" CONFIGURATION_BUILD_DIR="$(pwd)/build/Release-iphoneos"

      - name: Generate .ipa Payload
        run: |
          # Search for the .app generated by Xcode
          APP_PATH=$(find . ~/Library/Developer/Xcode/DerivedData -type d -name "*.app" 2>/dev/null | grep -i "iphoneos" | head -n 1)
          
          if [ -d "$APP_PATH" ]; then
            echo "Aplicación encontrada en: $APP_PATH"
            mkdir -p Payload
            # Importante: macOS usa symlinks internos en los archivos .app, cp y zip deben conservarlos (-a y -y)
            cp -a "$APP_PATH" Payload/
            zip -qry Resonance.ipa Payload
            echo "IPA_PATH=$PWD/Resonance.ipa" >> $GITHUB_ENV
          else
            echo "Directorio de build no encontrado."
            exit 1
          fi

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resonance-iOS-IPA
          path: ${{ env.IPA_PATH }}
          retention-days: 3



















