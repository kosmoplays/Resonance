name: Build iOS App (Sideloadly)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim

      - name: Install frontend dependencies
        run: npm install

      - name: Initialize iOS project
        run: npx tauri ios init

      - name: Build Tauri iOS App (Unsigned)
        run: |
          # Creamos un interceptor para xcodebuild que añade flags de firma nula obligatorios
          mkdir -p .github/bin
          echo '#!/bin/bash' > .github/bin/xcodebuild
          echo 'exec /usr/bin/xcodebuild "$@" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_IDENTITY=""' >> .github/bin/xcodebuild
          chmod +x .github/bin/xcodebuild
          
          # Añadimos nuestro xcodebuild falso al PATH para que Tauri lo use
          export PATH="$PWD/.github/bin:$PATH"
          
          # Compilamos la aplicación (Fallará al exportar el IPA porque no hay firma, pero el .app ya estará construido)
          npx tauri ios build || true

      - name: Generate .ipa Payload
        run: |
          # Buscar la carpeta generada por Xcode en DerivedData
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "Resonance.app" | grep -i "release-iphoneos" | head -n 1)
          
          if [ -d "$APP_PATH" ]; then
            echo "Aplicación encontrada en: $APP_PATH"
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            zip -qr Resonance.ipa Payload
            echo "IPA_PATH=$PWD/Resonance.ipa" >> $GITHUB_ENV
          else
            echo "Directorio de build no encontrado."
            exit 1
          fi

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resonance-iOS-IPA
          path: ${{ env.IPA_PATH }}
          retention-days: 3
