<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070814" />
      <stop offset="50%" stop-color="#090a1f" />
      <stop offset="100%" stop-color="#05050b" />
    </linearGradient>
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="32" flood-color="#3b82f6" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- BACKGROUND BASE -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)" />

  <!-- EMBLEM BADGE -->
  <rect x="160" y="160" width="704" height="704" rx="176" fill="url(#emblemGrad)" filter="url(#glow)" />

  <!-- SOUNDWAVE BARS -->
  <g fill="#ffffff">
    <!-- Bar 1 (Left-most) -->
    <rect x="272" y="392" width="72" height="240" rx="36" />
    <!-- Bar 2 (Mid-left) -->
    <rect x="404" y="272" width="72" height="480" rx="36" />
    <!-- Bar 3 (Mid-right, tallest) -->
    <rect x="548" y="200" width="72" height="624" rx="36" />
    <!-- Bar 4 (Right-most) -->
    <rect x="680" y="344" width="72" height="336" rx="36" />
  </g>
</svg>
